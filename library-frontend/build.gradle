// library-frontend - 웹 UI (JSP + HttpClient)

dependencies {
    // Spring MVC
    implementation 'org.springframework:spring-webmvc:6.1.1'
    implementation 'org.springframework:spring-context:6.1.1'
    implementation 'org.springframework:spring-web:6.1.1'
    
    // Servlet & JSP
    providedCompile 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    providedCompile 'jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.1'
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
    
    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.0'
    
    // HTTP Client
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'
}

// JSP 파일 포함
war {
    from('src/main/webapp') {
        into ''
    }
}
