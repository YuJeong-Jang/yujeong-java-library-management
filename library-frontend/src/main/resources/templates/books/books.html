<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/default}">

<head>
    <title>도서 관리 - 도서관리 시스템</title>
</head>

<body>
    <div layout:fragment="content">
        <!-- Page Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-4 sm:mb-0 flex items-center">
                <i class="fas fa-book mr-3 text-blue-600"></i>도서 관리
            </h1>
            <!-- 관리자만 도서 등록 버튼 표시 -->
            <button th:if="${loginMember != null and (loginMember.role == 'ADMIN' or loginMember.role == 1)}"
                onclick="openBookModal()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg transition-colors flex items-center">
                <i class="fas fa-plus mr-2"></i>도서 등록
            </button>
        </div>

        <!-- Search Bar -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <form th:action="@{/books}" method="get" class="flex gap-2">
                        <input type="text" name="keyword" th:value="${keyword}" placeholder="도서명 또는 저자명으로 검색"
                            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <button type="submit"
                            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition-colors">
                            <i class="fas fa-search"></i>
                        </button>
                    </form>
                </div>
                <div class="text-right">
                    <span class="text-gray-600">
                        총 <strong class="text-blue-600" th:text="${books != null ? books.size() : 0}">0</strong>권의 도서
                    </span>
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-6">
            <div class="flex items-center">
                <i class="fas fa-exclamation-triangle mr-2"></i>
                <span th:text="${error}"></span>
            </div>
        </div>

        <!-- Books Grid -->
        <div th:if="${books != null and !books.isEmpty()}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div th:each="book : ${books}" class="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow">
                <div class="p-6">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-lg font-semibold text-gray-800 line-clamp-2" th:text="${book.title}">도서명</h3>
                        <span class="px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">대여가능</span>
                    </div>

                    <div class="space-y-2 mb-4">
                        <p class="text-gray-600 flex items-center">
                            <i class="fas fa-user mr-2 text-gray-400"></i>
                            <span th:text="${book.author}">저자</span>
                        </p>
                        <p th:if="${book.publisher}" class="text-gray-600 flex items-center">
                            <i class="fas fa-building mr-2 text-gray-400"></i>
                            <span th:text="${book.publisher}">출판사</span>
                        </p>
                        <p th:if="${book.category}" class="text-gray-600 flex items-center">
                            <i class="fas fa-tag mr-2 text-gray-400"></i>
                            <span th:text="${book.category}">카테고리</span>
                        </p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-4 p-3 bg-gray-50 rounded-lg">
                        <div class="text-center">
                            <div class="text-sm text-gray-500">총 수량</div>
                            <div class="text-lg font-bold text-gray-800" th:text="${book.totalQuantity}">0</div>
                        </div>
                        <div class="text-center">
                            <div class="text-sm text-gray-500">대여가능</div>
                            <div class="text-lg font-bold text-green-600" th:text="${book.availableQty}">0</div>
                        </div>
                    </div>

                    <!-- 관리자만 수정/삭제 버튼 표시 -->
                    <div th:if="${loginMember != null and (loginMember.role == 'ADMIN' or loginMember.role == 1)}"
                        class="flex gap-2">
                        <button th:onclick="'editBook(' + ${book.id} + ')'"
                            class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg transition-colors text-sm">
                            <i class="fas fa-edit mr-1"></i>수정
                        </button>
                        <button th:onclick="'deleteBook(' + ${book.id} + ')'"
                            class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-lg transition-colors text-sm">
                            <i class="fas fa-trash mr-1"></i>삭제
                        </button>
                    </div>
                    <!-- 일반 회원에게는 조회 전용 메시지 표시 -->
                    <div th:if="${loginMember == null or (loginMember.role != 'ADMIN' and loginMember.role != 1)}"
                        class="text-center py-2">
                        <span class="text-gray-500 text-sm">
                            <i class="fas fa-eye mr-1"></i>조회 전용
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${books == null or books.isEmpty()}" class="text-center py-12">
            <i class="fas fa-book text-6xl text-gray-300 mb-4"></i>
            <h3 class="text-xl font-semibold text-gray-600 mb-2">등록된 도서가 없습니다</h3>
            <p class="text-gray-500 mb-6">새로운 도서를 등록해보세요.</p>
            <button onclick="openBookModal()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg transition-colors">
                <i class="fas fa-plus mr-2"></i>첫 번째 도서 등록하기
            </button>
        </div>

        <!-- Book Registration Modal -->
        <div id="bookModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 max-h-screen overflow-y-auto">
                <div class="flex justify-between items-center p-6 border-b">
                    <h2 class="text-xl font-semibold text-gray-800">
                        <i class="fas fa-book mr-2 text-blue-600"></i>도서 등록
                    </h2>
                    <button onclick="closeBookModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>

                <div class="p-6">
                    <form id="bookForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="md:col-span-2">
                                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">도서명 *</label>
                                <input type="text" id="title" name="title" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                            <div>
                                <label for="author" class="block text-sm font-medium text-gray-700 mb-1">저자 *</label>
                                <input type="text" id="author" name="author" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                            <div>
                                <label for="isbn" class="block text-sm font-medium text-gray-700 mb-1">ISBN</label>
                                <input type="text" id="isbn" name="isbn"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                            <div>
                                <label for="publisher" class="block text-sm font-medium text-gray-700 mb-1">출판사</label>
                                <input type="text" id="publisher" name="publisher"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                            <div>
                                <label for="category" class="block text-sm font-medium text-gray-700 mb-1">카테고리</label>
                                <select id="category" name="category"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                    <option value="">카테고리 선택</option>
                                    <option value="소설">소설</option>
                                    <option value="에세이">에세이</option>
                                    <option value="자기계발">자기계발</option>
                                    <option value="경제/경영">경제/경영</option>
                                    <option value="과학/기술">과학/기술</option>
                                    <option value="역사">역사</option>
                                    <option value="예술">예술</option>
                                    <option value="기타">기타</option>
                                </select>
                            </div>
                            <div>
                                <label for="publishDate"
                                    class="block text-sm font-medium text-gray-700 mb-1">출간일</label>
                                <input type="date" id="publishDate" name="publishDate"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                            <div>
                                <label for="totalQuantity" class="block text-sm font-medium text-gray-700 mb-1">총 수량
                                    *</label>
                                <input type="number" id="totalQuantity" name="totalQuantity" min="1" value="1" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                            <div>
                                <label for="availableQty" class="block text-sm font-medium text-gray-700 mb-1">대여가능 수량
                                    *</label>
                                <input type="number" id="availableQty" name="availableQty" min="0" value="1" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                        </div>
                    </form>
                </div>

                <div class="flex justify-end gap-3 p-6 border-t bg-gray-50">
                    <button onclick="closeBookModal()"
                        class="px-4 py-2 text-gray-700 bg-gray-200 hover:bg-gray-300 rounded-lg transition-colors">
                        취소
                    </button>
                    <button onclick="submitBookForm()"
                        class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors">
                        <i class="fas fa-check mr-1"></i>등록
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script>
            document.addEventListener( 'DOMContentLoaded', function () {
                // Book modal functions
                window.openBookModal = function () {
                    const modal = document.getElementById( 'bookModal' );
                    if ( modal ) {
                        modal.classList.remove( 'hidden' );
                        modal.classList.add( 'flex' );
                    }
                };

                window.closeBookModal = function () {
                    const modal = document.getElementById( 'bookModal' );
                    if ( modal ) {
                        modal.classList.add( 'hidden' );
                        modal.classList.remove( 'flex' );

                        // 폼 초기화
                        const form = document.getElementById( 'bookForm' );
                        if ( form ) {
                            form.reset();
                        }

                        // 모달 제목과 버튼 초기화
                        document.querySelector( '#bookModal h2' ).innerHTML = '<i class="fas fa-book mr-2 text-blue-600"></i>도서 등록';
                        const submitBtn = document.querySelector( '#bookModal button[onclick*="Form"]' );
                        submitBtn.innerHTML = '<i class="fas fa-check mr-1"></i>등록';
                        submitBtn.setAttribute( 'onclick', 'submitBookForm()' );
                    }
                };

                window.submitBookForm = function () {
                    const form = document.getElementById( 'bookForm' );
                    if ( form ) {
                        const formData = new FormData( form );
                        const data = Object.fromEntries( formData );

                        // 숫자 필드 변환
                        data.totalQuantity = parseInt( data.totalQuantity ) || 1;
                        data.availableQty = parseInt( data.availableQty ) || 1;

                        // API 호출
                        fetch( '/books', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify( data )
                        } )
                            .then( response => response.json() )
                            .then( result => {
                                if ( result.success ) {
                                    showAlert( '도서가 성공적으로 등록되었습니다.', 'success' );
                                    closeBookModal();
                                    location.reload();
                                } else {
                                    showAlert( '도서 등록에 실패했습니다: ' + ( result.message || '알 수 없는 오류' ), 'error' );
                                }
                            } )
                            .catch( error => {
                                showAlert( '도서 등록 중 오류가 발생했습니다.', 'error' );
                            } );
                    }
                };

                window.editBook = function ( bookId ) {
                    // 도서 정보 조회 후 모달에 채우기
                    fetch( '/books/api/' + bookId )
                        .then( response => response.json() )
                        .then( result => {
                            if ( result.success ) {
                                const book = result.data;

                                // 폼 필드에 기존 데이터 채우기
                                document.getElementById( 'title' ).value = book.title || '';
                                document.getElementById( 'author' ).value = book.author || '';
                                document.getElementById( 'isbn' ).value = book.isbn || '';
                                document.getElementById( 'publisher' ).value = book.publisher || '';
                                document.getElementById( 'category' ).value = book.category || '';
                                document.getElementById( 'publishDate' ).value = book.publishDate || '';
                                document.getElementById( 'totalQuantity' ).value = book.totalQuantity || 1;
                                document.getElementById( 'availableQty' ).value = book.availableQty || 1;

                                // 모달 제목 변경
                                document.querySelector( '#bookModal h2' ).innerHTML = '<i class="fas fa-edit mr-2 text-blue-600"></i>도서 수정';

                                // 버튼 텍스트 변경
                                const submitBtn = document.querySelector( '#bookModal button[onclick="submitBookForm()"]' );
                                submitBtn.innerHTML = '<i class="fas fa-save mr-1"></i>수정';
                                submitBtn.setAttribute( 'onclick', 'updateBookForm(' + bookId + ')' );

                                // 모달 열기
                                openBookModal();
                            } else {
                                showAlert( '도서 정보를 불러오는데 실패했습니다: ' + ( result.message || '알 수 없는 오류' ), 'error' );
                            }
                        } )
                        .catch( error => {
                            showAlert( '도서 정보를 불러오는 중 오류가 발생했습니다.', 'error' );
                        } );
                };

                window.updateBookForm = function ( bookId ) {
                    const form = document.getElementById( 'bookForm' );
                    if ( form ) {
                        const formData = new FormData( form );
                        const bookData = Object.fromEntries( formData );

                        // 숫자 필드 변환
                        bookData.totalQuantity = parseInt( bookData.totalQuantity ) || 1;
                        bookData.availableQty = parseInt( bookData.availableQty ) || 1;

                        fetch( '/books/' + bookId, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify( bookData )
                        } )
                            .then( response => response.json() )
                            .then( result => {
                                if ( result.success ) {
                                    showAlert( '도서가 성공적으로 수정되었습니다.', 'success' );
                                    closeBookModal();
                                    location.reload();
                                } else {
                                    showAlert( '도서 수정에 실패했습니다: ' + ( result.message || '알 수 없는 오류' ), 'error' );
                                }
                            } )
                            .catch( error => {
                                showAlert( '도서 수정 중 오류가 발생했습니다.', 'error' );
                            } );
                    }
                };

                window.deleteBook = function ( bookId ) {
                    if ( confirm( '정말로 이 도서를 삭제하시겠습니까?' ) ) {
                        fetch( '/books/' + bookId, {
                            method: 'DELETE',
                            headers: {
                                'Content-Type': 'application/json',
                            }
                        } )
                            .then( response => response.json() )
                            .then( result => {
                                if ( result.success ) {
                                    showAlert( '도서가 성공적으로 삭제되었습니다.', 'success' );
                                    location.reload();
                                } else {
                                    showAlert( '도서 삭제에 실패했습니다: ' + ( result.message || '알 수 없는 오류' ), 'error' );
                                }
                            } )
                            .catch( error => {
                                showAlert( '도서 삭제 중 오류가 발생했습니다.', 'error' );
                            } );
                    }
                };

                // Close modal when clicking outside
                const bookModal = document.getElementById( 'bookModal' );
                if ( bookModal ) {
                    bookModal.addEventListener( 'click', function ( e ) {
                        if ( e.target === this ) {
                            closeBookModal();
                        }
                    } );
                }
            } );
        </script>
    </div>
</body>

</html>
