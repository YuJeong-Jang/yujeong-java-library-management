<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/default}">

<head>
    <title>회원 관리 - 도서관리 시스템</title>
</head>

<body>
    <div layout:fragment="content">
        <!-- Page Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-900 flex items-center">
                <i class="fas fa-users mr-3 text-blue-600"></i>회원 관리
            </h1>
            <!-- 관리자만 회원 등록 버튼 표시 -->
            <button th:if="${loginMember != null and (loginMember.role == 'ADMIN' or loginMember.role == 1)}"
                class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg flex items-center transition-colors"
                onclick="openMemberModal()">
                <i class="fas fa-user-plus mr-2"></i>회원 등록
            </button>
        </div>

        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-lg p-6 text-center">
                <i class="fas fa-users text-4xl mb-3 opacity-80"></i>
                <h4 class="text-2xl font-bold" th:text="${totalMembers != null ? totalMembers : 0}">0</h4>
                <p class="text-blue-100">총 회원 수</p>
            </div>
            <div class="bg-gradient-to-r from-green-500 to-green-600 text-white rounded-lg p-6 text-center">
                <i class="fas fa-user-check text-4xl mb-3 opacity-80"></i>
                <h4 class="text-2xl font-bold" th:text="${activeMembers != null ? activeMembers : 0}">0</h4>
                <p class="text-green-100">활성 회원</p>
            </div>
            <div class="bg-gradient-to-r from-yellow-500 to-yellow-600 text-white rounded-lg p-6 text-center">
                <i class="fas fa-user-times text-4xl mb-3 opacity-80"></i>
                <h4 class="text-2xl font-bold" th:text="${inactiveMembers != null ? inactiveMembers : 0}">0</h4>
                <p class="text-yellow-100">비활성 회원</p>
            </div>
            <div class="bg-gradient-to-r from-purple-500 to-purple-600 text-white rounded-lg p-6 text-center">
                <i class="fas fa-shield-alt text-4xl mb-3 opacity-80"></i>
                <h4 class="text-2xl font-bold" th:text="${adminMembers != null ? adminMembers : 0}">0</h4>
                <p class="text-purple-100">관리자</p>
            </div>
        </div>

        <!-- Error Message -->
        <div th:if="${error}"
            class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 flex items-center">
            <i class="fas fa-exclamation-triangle mr-2"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Members Table -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden" th:if="${members != null and !members.isEmpty()}">
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
                <h5 class="text-lg font-semibold text-gray-900 flex items-center">
                    <i class="fas fa-list mr-2 text-blue-600"></i>회원 목록
                </h5>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                로그인 ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                이름</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                이메일</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                전화번호</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                상태</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                역할</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                가입일</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                관리</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="member : ${members}" class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${member.id}">1</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="text-sm font-medium text-gray-900"
                                    th:text="${member.loginId}">user123</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${member.name}">홍길동
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <a th:href="'mailto:' + ${member.email}"
                                    class="text-sm text-blue-600 hover:text-blue-800"
                                    th:text="${member.email}">user@example.com</a>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900"
                                th:text="${member.phone ?: '-'}">010-1234-5678</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span th:if="${member.status == 'ACTIVE' or member.status == 0}"
                                    class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">
                                    <i class="fas fa-check-circle mr-1"></i>활성
                                </span>
                                <span th:if="${member.status == 'INACTIVE' or member.status == 1}"
                                    class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800">
                                    <i class="fas fa-times-circle mr-1"></i>비활성
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span th:if="${member.role == 'USER' or member.role == 0}"
                                    class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-800">
                                    <i class="fas fa-user mr-1"></i>일반
                                </span>
                                <span th:if="${member.role == 'ADMIN' or member.role == 1}"
                                    class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-purple-100 text-purple-800">
                                    <i class="fas fa-shield-alt mr-1"></i>관리자
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">2024-01-01</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <!-- 관리자만 관리 버튼들 표시 -->
                                <div th:if="${loginMember != null and (loginMember.role == 'ADMIN' or loginMember.role == 1)}"
                                    class="flex space-x-2">
                                    <button type="button" class="text-blue-600 hover:text-blue-900 p-1 tooltip"
                                        th:data-member-id="${member.id}" onclick="editMember(this.dataset.memberId)"
                                        title="수정">
                                        <i class="fas fa-edit"></i>
                                    </button>

                                    <!-- 활성화/비활성화 버튼 -->
                                    <button th:if="${member.status == 'ACTIVE' or member.status == 0}" type="button"
                                        class="text-yellow-600 hover:text-yellow-900 p-1 tooltip"
                                        th:data-member-id="${member.id}"
                                        onclick="deactivateMember(this.dataset.memberId)" title="비활성화">
                                        <i class="fas fa-user-times"></i>
                                    </button>
                                    <button th:if="${member.status == 'INACTIVE' or member.status == 1}" type="button"
                                        class="text-green-600 hover:text-green-900 p-1 tooltip"
                                        th:data-member-id="${member.id}" onclick="activateMember(this.dataset.memberId)"
                                        title="활성화">
                                        <i class="fas fa-user-check"></i>
                                    </button>

                                    <!-- 관리자 권한 토글 버튼 -->
                                    <button type="button" class="text-purple-600 hover:text-purple-900 p-1 tooltip"
                                        th:data-member-id="${member.id}" th:data-member-role="${member.role ?: 'USER'}"
                                        onclick="toggleAdminRole(this.dataset.memberId, this.dataset.memberRole)"
                                        th:title="${member.role == 'ADMIN' or member.role == 1} ? '관리자 권한 회수' : '관리자 권한 부여'">
                                        <i class="fas fa-shield-alt"></i>
                                    </button>

                                    <button type="button" class="text-red-600 hover:text-red-900 p-1 tooltip"
                                        th:data-member-id="${member.id}" onclick="deleteMember(this.dataset.memberId)"
                                        title="삭제">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                                <!-- 일반 회원에게는 조회 전용 메시지 표시 -->
                                <div th:if="${loginMember == null or (loginMember.role != 'ADMIN' and loginMember.role != 1)}"
                                    class="text-center">
                                    <span class="text-gray-500 text-sm">
                                        <i class="fas fa-eye mr-1"></i>조회 전용
                                    </span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${members == null or members.isEmpty()}" class="text-center py-16">
            <i class="fas fa-users text-gray-400 text-6xl mb-4"></i>
            <h3 class="text-xl font-semibold text-gray-600 mb-2">등록된 회원이 없습니다</h3>
            <p class="text-gray-500 mb-6">새로운 회원을 등록해보세요.</p>
            <button
                class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg flex items-center mx-auto transition-colors"
                onclick="openMemberModal()">
                <i class="fas fa-user-plus mr-2"></i>첫 번째 회원 등록하기
            </button>
        </div>

        <!-- Member Registration Modal -->
        <div id="memberModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center z-50">
            <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 max-h-screen overflow-y-auto">
                <div class="flex items-center justify-between p-6 border-b border-gray-200">
                    <h5 class="text-lg font-semibold text-gray-900 flex items-center">
                        <i class="fas fa-user-plus mr-2 text-blue-600"></i>회원 등록
                    </h5>
                    <button type="button" class="text-gray-400 hover:text-gray-600" onclick="closeMemberModal()">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <div class="p-6">
                    <form id="memberForm">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="mb-4">
                                <label for="loginId" class="block text-sm font-medium text-gray-700 mb-2">로그인 ID
                                    *</label>
                                <input type="text"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    id="loginId" name="loginId" required>
                                <p class="text-xs text-gray-500 mt-1">4-50자 사이의 영문, 숫자 조합</p>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">비밀번호
                                    *</label>
                                <input type="password"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    id="password" name="password" required>
                                <p class="text-xs text-gray-500 mt-1">최소 6자 이상</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="mb-4">
                                <label for="name" class="block text-sm font-medium text-gray-700 mb-2">이름 *</label>
                                <input type="text"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    id="name" name="name" required>
                            </div>
                            <div class="mb-4">
                                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">이메일 *</label>
                                <input type="email"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    id="email" name="email" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">전화번호</label>
                            <input type="tel"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                id="phone" name="phone" placeholder="010-1234-5678">
                        </div>
                    </form>
                </div>
                <div class="flex justify-end space-x-3 p-6 border-t border-gray-200">
                    <button type="button"
                        class="px-4 py-2 text-gray-700 bg-gray-200 hover:bg-gray-300 rounded-md transition-colors"
                        onclick="closeMemberModal()">취소</button>
                    <button type="button"
                        class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-md flex items-center transition-colors"
                        onclick="submitMemberForm()">
                        <i class="fas fa-check mr-2"></i>등록
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script>
            document.addEventListener( 'DOMContentLoaded', function () {
                // Member modal functions
                window.openMemberModal = function () {
                    const modal = document.getElementById( 'memberModal' );
                    if ( modal ) {
                        modal.classList.remove( 'hidden' );
                        modal.classList.add( 'flex' );
                    }
                };

                window.closeMemberModal = function () {
                    const modal = document.getElementById( 'memberModal' );
                    const form = document.getElementById( 'memberForm' );
                    if ( modal ) {
                        modal.classList.add( 'hidden' );
                        modal.classList.remove( 'flex' );
                    }
                    if ( form ) {
                        form.reset();
                        // 아이디 필드 읽기 전용 해제
                        document.getElementById( 'loginId' ).readOnly = false;
                        document.getElementById( 'password' ).placeholder = '';
                    }

                    // 모달 제목과 버튼 초기화
                    const modalTitle = document.querySelector( '#memberModal h5' );
                    if ( modalTitle ) {
                        modalTitle.innerHTML = '<i class="fas fa-user-plus mr-2 text-blue-600"></i>회원 등록';
                    }
                    const submitBtn = document.querySelector( '#memberModal button[onclick*="Form"]' );
                    if ( submitBtn ) {
                        submitBtn.innerHTML = '<i class="fas fa-check mr-2"></i>등록';
                        submitBtn.setAttribute( 'onclick', 'submitMemberForm()' );
                    }
                };

                window.submitMemberForm = function () {
                    const form = document.getElementById( 'memberForm' );
                    if ( form ) {
                        const formData = new FormData( form );
                        const data = Object.fromEntries( formData );

                        // API 호출
                        fetch( '/members', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify( data )
                        } )
                            .then( response => response.json() )
                            .then( result => {
                                if ( result.success ) {
                                    showAlert( '회원이 성공적으로 등록되었습니다.', 'success' );
                                    closeMemberModal();
                                    location.reload();
                                } else {
                                    showAlert( '회원 등록에 실패했습니다: ' + ( result.message || '알 수 없는 오류' ), 'error' );
                                }
                            } )
                            .catch( error => {
                                showAlert( '회원 등록 중 오류가 발생했습니다.', 'error' );
                            } );
                    }
                };

                window.editMember = function ( memberId ) {
                    // 회원 정보 조회 후 모달에 채우기
                    fetch( '/members/api/' + memberId )
                        .then( response => response.json() )
                        .then( result => {
                            if ( result.success ) {
                                const member = result.data;

                                // 폼 필드에 기존 데이터 채우기
                                document.getElementById( 'loginId' ).value = member.loginId || '';
                                document.getElementById( 'loginId' ).readOnly = true; // 아이디는 수정 불가
                                document.getElementById( 'password' ).value = ''; // 비밀번호는 비워둠
                                document.getElementById( 'password' ).placeholder = '변경하지 않으려면 비워두세요';
                                document.getElementById( 'name' ).value = member.name || '';
                                document.getElementById( 'email' ).value = member.email || '';
                                document.getElementById( 'phone' ).value = member.phone || '';

                                // 모달 제목 변경
                                const modalTitle = document.querySelector( '#memberModal h5' );
                                if ( modalTitle ) {
                                    modalTitle.innerHTML = '<i class="fas fa-user-edit mr-2 text-blue-600"></i>회원 수정';
                                }

                                // 버튼 텍스트 변경
                                const submitBtn = document.querySelector( '#memberModal button[onclick="submitMemberForm()"]' );
                                if ( submitBtn ) {
                                    submitBtn.innerHTML = '<i class="fas fa-save mr-2"></i>수정';
                                    submitBtn.setAttribute( 'onclick', 'updateMemberForm(' + memberId + ')' );
                                }

                                // 모달 열기
                                openMemberModal();
                            } else {
                                showAlert( '회원 정보를 불러오는데 실패했습니다: ' + ( result.message || '알 수 없는 오류' ), 'error' );
                            }
                        } )
                        .catch( error => {
                            showAlert( '회원 정보를 불러오는 중 오류가 발생했습니다.', 'error' );
                        } );
                };

                window.updateMemberForm = function ( memberId ) {
                    const form = document.getElementById( 'memberForm' );
                    if ( form ) {
                        const formData = new FormData( form );
                        const memberData = Object.fromEntries( formData );

                        // 비밀번호가 비어있으면 제거
                        if ( !memberData.password || memberData.password.trim() === '' ) {
                            delete memberData.password;
                        }

                        fetch( '/members/' + memberId, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify( memberData )
                        } )
                            .then( response => response.json() )
                            .then( result => {
                                if ( result.success ) {
                                    showAlert( '회원 정보가 성공적으로 수정되었습니다.', 'success' );
                                    closeMemberModal();
                                    location.reload();
                                } else {
                                    showAlert( '회원 수정에 실패했습니다: ' + ( result.message || '알 수 없는 오류' ), 'error' );
                                }
                            } )
                            .catch( error => {
                                showAlert( '회원 수정 중 오류가 발생했습니다.', 'error' );
                            } );
                    }
                };

                window.deactivateMember = function ( memberId ) {
                    if ( confirm( '이 회원을 비활성화하시겠습니까?' ) ) {
                        fetch( '/members/' + memberId + '/deactivate', {
                            method: 'PATCH',
                            headers: {
                                'Content-Type': 'application/json',
                            }
                        } )
                            .then( response => response.json() )
                            .then( result => {
                                if ( result.success ) {
                                    showAlert( '회원이 성공적으로 비활성화되었습니다.', 'success' );
                                    location.reload();
                                } else {
                                    showAlert( '회원 비활성화에 실패했습니다: ' + ( result.message || '알 수 없는 오류' ), 'error' );
                                }
                            } )
                            .catch( error => {
                                showAlert( '회원 비활성화 중 오류가 발생했습니다.', 'error' );
                            } );
                    }
                };

                window.activateMember = function ( memberId ) {
                    if ( confirm( '이 회원을 활성화하시겠습니까?' ) ) {
                        fetch( '/members/' + memberId + '/activate', {
                            method: 'PATCH',
                            headers: {
                                'Content-Type': 'application/json',
                            }
                        } )
                            .then( response => response.json() )
                            .then( result => {
                                if ( result.success ) {
                                    showAlert( '회원이 성공적으로 활성화되었습니다.', 'success' );
                                    location.reload();
                                } else {
                                    showAlert( '회원 활성화에 실패했습니다: ' + ( result.message || '알 수 없는 오류' ), 'error' );
                                }
                            } )
                            .catch( error => {
                                showAlert( '회원 활성화 중 오류가 발생했습니다.', 'error' );
                            } );
                    }
                };

                window.toggleAdminRole = function ( memberId, currentRole ) {
                    const isAdmin = currentRole === 'ADMIN';
                    const action = isAdmin ? '회수' : '부여';
                    const newRole = isAdmin ? 0 : 1; // 0: USER, 1: ADMIN

                    if ( confirm( `이 회원의 관리자 권한을 ${ action }하시겠습니까?` ) ) {
                        fetch( '/members/' + memberId + '/role', {
                            method: 'PATCH',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify( { role: newRole } )
                        } )
                            .then( response => response.json() )
                            .then( result => {
                                if ( result.success ) {
                                    showAlert( `관리자 권한이 성공적으로 ${ action }되었습니다.`, 'success' );
                                    location.reload();
                                } else {
                                    showAlert( `관리자 권한 ${ action }에 실패했습니다: ` + ( result.message || '알 수 없는 오류' ), 'error' );
                                }
                            } )
                            .catch( error => {
                                showAlert( `관리자 권한 ${ action } 중 오류가 발생했습니다.`, 'error' );
                            } );
                    }
                };

                // 기존 makeAdmin 함수는 호환성을 위해 유지
                window.makeAdmin = function ( memberId ) {
                    toggleAdminRole( memberId, 'USER' );
                };

                window.deleteMember = function ( memberId ) {
                    if ( confirm( '정말로 이 회원을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.' ) ) {
                        fetch( '/members/' + memberId, {
                            method: 'DELETE',
                            headers: {
                                'Content-Type': 'application/json',
                            }
                        } )
                            .then( response => {
                                if ( !response.ok ) {
                                    throw new Error( `HTTP error! status: ${ response.status }` );
                                }
                                return response.json();
                            } )
                            .then( result => {
                                if ( result.success ) {
                                    showAlert( '회원이 성공적으로 삭제되었습니다.', 'success' );
                                    location.reload();
                                } else {
                                    // 에러 타입에 따른 메시지 분기
                                    if ( result.errorType === 'FOREIGN_KEY_CONSTRAINT' ) {
                                        showAlert( '⚠️ 삭제 불가: ' + result.message + '\n\n💡 대안: 회원을 비활성화하거나 모든 대여 기록 반납 후 삭제하기', 'warning' );
                                    } else {
                                        showAlert( '회원 삭제에 실패했습니다: ' + ( result.message || '알 수 없는 오류' ), 'error' );
                                    }
                                }
                            } )
                            .catch( error => {
                                showAlert( '회원 삭제 중 오류가 발생했습니다: ' + error.message, 'error' );
                            } );
                    }
                };

                // Close modal when clicking outside
                const memberModal = document.getElementById( 'memberModal' );
                if ( memberModal ) {
                    memberModal.addEventListener( 'click', function ( e ) {
                        if ( e.target === this ) {
                            closeMemberModal();
                        }
                    } );
                }
            } );
        </script>
    </div>
</body>

</html>
