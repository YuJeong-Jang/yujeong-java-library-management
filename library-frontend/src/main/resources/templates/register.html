<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 도서관리 시스템</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gradient-to-br from-green-50 to-blue-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <!-- 로고 섹션 -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-green-600 rounded-full mb-4">
                <i class="fas fa-user-plus text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">도서관리 시스템</h1>
            <p class="text-gray-600 mt-2">회원가입</p>
        </div>

        <!-- 회원 유형 선택 -->
        <div class="bg-white rounded-2xl shadow-xl p-8 mb-6">
            <div class="text-center mb-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">회원 유형을 선택하세요</h2>
                <div class="grid grid-cols-2 gap-4">
                    <button id="userTypeBtn" onclick="selectUserType('USER')"
                        class="user-type-btn p-4 border-2 border-gray-300 rounded-lg hover:border-blue-500 transition-colors">
                        <i class="fas fa-user text-3xl text-blue-600 mb-2"></i>
                        <p class="font-medium text-gray-800">일반 회원</p>
                        <p class="text-sm text-gray-500">도서 대여 및 이용</p>
                    </button>
                    <button id="adminTypeBtn" onclick="selectUserType('ADMIN')"
                        class="user-type-btn p-4 border-2 border-gray-300 rounded-lg hover:border-purple-500 transition-colors">
                        <i class="fas fa-shield-alt text-3xl text-purple-600 mb-2"></i>
                        <p class="font-medium text-gray-800">관리자</p>
                        <p class="text-sm text-gray-500">시스템 관리</p>
                    </button>
                </div>
            </div>
        </div>

        <!-- 회원가입 폼 -->
        <div id="registerForm" class="bg-white rounded-2xl shadow-xl p-8 hidden">
            <form id="signupForm">
                <input type="hidden" id="userRole" name="role" value="">

                <div class="space-y-4">
                    <!-- 아이디 입력 -->
                    <div>
                        <label for="loginId" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-user mr-2"></i>아이디 *
                        </label>
                        <input type="text" id="loginId" name="loginId" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-colors"
                            placeholder="4-20자 영문, 숫자 조합">
                        <p class="text-xs text-gray-500 mt-1">영문, 숫자 조합 4-20자</p>
                    </div>

                    <!-- 비밀번호 입력 -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock mr-2"></i>비밀번호 *
                        </label>
                        <input type="password" id="password" name="password" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-colors"
                            placeholder="최소 6자 이상">
                        <p class="text-xs text-gray-500 mt-1">최소 6자 이상</p>
                    </div>

                    <!-- 비밀번호 확인 -->
                    <div>
                        <label for="passwordConfirm" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock mr-2"></i>비밀번호 확인 *
                        </label>
                        <input type="password" id="passwordConfirm" name="passwordConfirm" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-colors"
                            placeholder="비밀번호를 다시 입력하세요">
                    </div>

                    <!-- 이름 입력 -->
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-id-card mr-2"></i>이름 *
                        </label>
                        <input type="text" id="name" name="name" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-colors"
                            placeholder="실명을 입력하세요">
                    </div>

                    <!-- 이메일 입력 -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-envelope mr-2"></i>이메일 *
                        </label>
                        <input type="email" id="email" name="email" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-colors"
                            placeholder="example@email.com">
                    </div>

                    <!-- 전화번호 입력 -->
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-phone mr-2"></i>전화번호
                        </label>
                        <input type="tel" id="phone" name="phone"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-colors"
                            placeholder="010-1234-5678">
                    </div>

                    <!-- 관리자 인증 코드 (관리자 선택시에만 표시) -->
                    <div id="adminCodeSection" class="hidden">
                        <label for="adminCode" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-key mr-2"></i>관리자 인증 코드 *
                        </label>
                        <input type="password" id="adminCode" name="adminCode"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-colors"
                            placeholder="관리자 인증 코드를 입력하세요">
                        <p class="text-xs text-gray-500 mt-1">관리자 권한을 위한 인증 코드가 필요합니다</p>
                    </div>

                    <!-- 에러 메시지 -->
                    <div id="errorMessage"
                        class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg">
                        <i class="fas fa-exclamation-triangle mr-2"></i>
                        <span id="errorText"></span>
                    </div>

                    <!-- 회원가입 버튼 -->
                    <button type="submit" id="registerButton"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors flex items-center justify-center">
                        <i class="fas fa-user-plus mr-2"></i>
                        <span id="registerButtonText">회원가입</span>
                    </button>
                </div>
            </form>

            <!-- 뒤로가기 버튼 -->
            <div class="mt-4 text-center">
                <button onclick="goBackToTypeSelection()" class="text-gray-600 hover:text-gray-800 text-sm">
                    <i class="fas fa-arrow-left mr-1"></i>회원 유형 다시 선택
                </button>
            </div>
        </div>

        <!-- 추가 링크 -->
        <div class="mt-6 text-center">
            <div class="space-y-2">
                <a href="/login" class="block text-blue-600 hover:text-blue-800 text-sm">
                    <i class="fas fa-sign-in-alt mr-1"></i>이미 계정이 있으신가요? 로그인
                </a>
                <a href="/" class="block text-gray-600 hover:text-gray-800 text-sm">
                    <i class="fas fa-home mr-1"></i>메인 페이지로 돌아가기
                </a>
            </div>
        </div>
    </div>

    <script>
        let selectedRole = '';

        function selectUserType( role ) {
            selectedRole = role;
            document.getElementById( 'userRole' ).value = role === 'ADMIN' ? '1' : '0';

            // 버튼 스타일 업데이트
            document.querySelectorAll( '.user-type-btn' ).forEach( btn => {
                btn.classList.remove( 'border-blue-500', 'border-purple-500', 'bg-blue-50', 'bg-purple-50' );
                btn.classList.add( 'border-gray-300' );
            } );

            if ( role === 'USER' ) {
                document.getElementById( 'userTypeBtn' ).classList.remove( 'border-gray-300' );
                document.getElementById( 'userTypeBtn' ).classList.add( 'border-blue-500', 'bg-blue-50' );
                document.getElementById( 'registerButtonText' ).textContent = '일반 회원가입';
            } else {
                document.getElementById( 'adminTypeBtn' ).classList.remove( 'border-gray-300' );
                document.getElementById( 'adminTypeBtn' ).classList.add( 'border-purple-500', 'bg-purple-50' );
                document.getElementById( 'registerButtonText' ).textContent = '관리자 회원가입';
            }

            // 폼 표시
            setTimeout( () => {
                document.getElementById( 'registerForm' ).classList.remove( 'hidden' );
                document.getElementById( 'registerForm' ).scrollIntoView( { behavior: 'smooth' } );

                // 관리자 선택시 인증 코드 섹션 표시
                if ( role === 'ADMIN' ) {
                    document.getElementById( 'adminCodeSection' ).classList.remove( 'hidden' );
                    document.getElementById( 'adminCodeInfo' ).classList.remove( 'hidden' );
                    document.getElementById( 'adminCode' ).required = true;
                } else {
                    document.getElementById( 'adminCodeSection' ).classList.add( 'hidden' );
                    document.getElementById( 'adminCodeInfo' ).classList.add( 'hidden' );
                    document.getElementById( 'adminCode' ).required = false;
                }
            }, 300 );
        }

        function goBackToTypeSelection() {
            document.getElementById( 'registerForm' ).classList.add( 'hidden' );
            document.getElementById( 'signupForm' ).reset();
            document.querySelectorAll( '.user-type-btn' ).forEach( btn => {
                btn.classList.remove( 'border-blue-500', 'border-purple-500', 'bg-blue-50', 'bg-purple-50' );
                btn.classList.add( 'border-gray-300' );
            } );
            hideError();
        }

        function showError( message ) {
            document.getElementById( 'errorText' ).textContent = message;
            document.getElementById( 'errorMessage' ).classList.remove( 'hidden' );
        }

        function hideError() {
            document.getElementById( 'errorMessage' ).classList.add( 'hidden' );
        }

        document.getElementById( 'signupForm' ).addEventListener( 'submit', function ( e ) {
            e.preventDefault();

            const formData = new FormData( this );
            const data = Object.fromEntries( formData );

            // 비밀번호 확인
            if ( data.password !== data.passwordConfirm ) {
                showError( '비밀번호가 일치하지 않습니다.' );
                return;
            }

            // 관리자 인증 코드 확인
            if ( selectedRole === 'ADMIN' && data.adminCode !== 'ADMIN2024' ) {
                showError( '관리자 인증 코드가 올바르지 않습니다.' );
                return;
            }

            // 불필요한 필드 제거
            delete data.passwordConfirm;
            delete data.adminCode;

            // 역할을 숫자로 변환
            data.role = parseInt( data.role );

            // 로딩 상태
            const registerButton = document.getElementById( 'registerButton' );
            registerButton.disabled = true;
            registerButton.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>가입 중...';
            hideError();

            // 회원가입 API 호출
            fetch( '/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify( data )
            } )
                .then( response => {
                    return response.json();
                } )
                .then( result => {
                    if ( result.success ) {
                        alert( result.message || '회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.' );
                        window.location.href = '/login';
                    } else {
                        showError( result.message || '회원가입에 실패했습니다.' );
                    }
                } )
                .catch( error => {
                    console.error( 'Error:', error );
                    showError( '회원가입 중 오류가 발생했습니다.' );
                } )
                .finally( () => {
                    // 로딩 상태 해제
                    registerButton.disabled = false;
                    registerButton.innerHTML = `<i class="fas fa-user-plus mr-2"></i>${ selectedRole === 'ADMIN' ? '관리자 회원가입' : '일반 회원가입' }`;
                } );
        } );
    </script>
</body>

</html>
