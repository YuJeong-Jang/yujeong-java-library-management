<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layouts/default">

<head>
    <title th:text="${title ?: '도서관리시스템'}">홈</title>
</head>

<body>
<div layout:fragment="content">
    <!-- 1. 히어로: 검색+로그인 그리드 (상단 즉시 보임) -->
    <section class="hero-baby">
        <div class="container" style="height: 250px;">
            <div class="row align-items-stretch h-100" style="min-height: 500px; display: flex; align-items: stretch;">
                <!-- 왼쪽 열 수정 -->
                <div class="col-lg-6 d-flex h-50"  style="display: flex; height: 100%; width: 100%">
                    <div class="hero-left-column h-100">
                        <h1 class="hero-title-baby mb-3">📚 우리 도서관리시스템</h1>
                        <p class="hero-text mb-4">아기자기하게 도서 빌려요~</p>
                        <!-- 검색 행 -->
                        <div class="search-row">
                            <div class="search-area flex-grow-1">
                                <div class="search-baby full">
                                    <i class="bi bi-search"></i>
                                    <input type="text" placeholder="도서명, 저자 검색해요~">
                                </div>
                            </div>
                            <div class="search-button-area">
                                <button class="btn-search-inline">
                                    <i class="bi bi-search"></i> 검색
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 오른쪽 열: 로그인 블럭 -->
                <div class="col-lg-6 d-flex h-50"  style="display: flex; height: 100%;">
                    <div class="login-block h-100 d-flex align-items-center justify-content-end">
                        <div class="login-inline-card-full">
                            <!-- 탭 -->
                            <div class="login-tabs-inline">
                                <button class="login-tab-inline active" data-tab="user-inline">회원</button>
                                <button class="login-tab-inline" data-tab="admin-inline">관리자</button>
                            </div>

                            <!-- 회원 로그인 -->
                            <div class="login-pane-inline active" id="user-inline">
                                <input type="text" class="form-control-inline" placeholder="회원번호">
                                <input type="password" class="form-control-inline" placeholder="비밀번호">
                                <button class="btn-login-inline">로그인</button>
                            </div>

                            <!-- 관리자 로그인 -->
                            <div class="login-pane-inline" id="admin-inline">
                                <input type="text" class="form-control-inline" placeholder="아이디">
                                <input type="password" class="form-control-inline" placeholder="비밀번호">
                                <button class="btn-login-inline">관리자</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <!-- 2. 통계: 진짜 한줄 4개 (일렬정렬) -->
    <section class="stats-baby">
        <div class="container">
            <div class="stats-row-single">
                <div class="stat-item-baby blue">
                    <i class="bi bi-book"></i>
                    <span th:text="${bookCount ?: 1234}">1,234</span>
                    <small>전체도서</small>
                </div>
                <div class="stat-item-baby green">
                    <i class="bi bi-arrow-left-right"></i>
                    <span th:text="${rentalCount ?: 342}">342</span>
                    <small>대여중</small>
                </div>
                <div class="stat-item-baby orange">
                    <i class="bi bi-clock-history"></i>
                    <span th:text="${overdueCount ?: 15}">15</span>
                    <small>연체됨</small>
                </div>
                <div class="stat-item-baby purple">
                    <i class="bi bi-hourglass-split"></i>
                    <span th:text="${reservationCount ?: 28}">28</span>
                    <small>예약대기</small>
                </div>
            </div>
        </div>
    </section>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 로그인 탭
        document.querySelectorAll('.tab-baby').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-baby').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content-baby').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab + '-login').classList.add('active');
            };
        });
    });
</script>
</body>
</html>
