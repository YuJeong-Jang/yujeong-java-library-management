<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(~{::content})}"
      th:with="title='도서목록', activePage='books'">

<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0"><i class="bi bi-book me-2"></i>도서목록</h1>
        <a href="/books/new" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> 새 도서 등록
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <!-- 여기부터는 기존 테이블 그대로 -->
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>표지</th>
                        <th>제목</th>
                        <th>저자</th>
                        <th>출판사</th>
                        <th>가격</th>
                        <th>재고</th>
                        <th>상태</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody th:if="${books}">
                    <tr th:each="book : ${books}">
                        <!-- ... 기존 book 행들 ... -->
                    </tr>
                    </tbody>
                    <tbody th:unless="${books}">
                    <tr>
                        <td colspan="8" class="text-center py-5 text-muted">등록된 도서가 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </
