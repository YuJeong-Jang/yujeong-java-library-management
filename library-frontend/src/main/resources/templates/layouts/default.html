<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: '도서관리시스템'">도서관리시스템</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}" rel="stylesheet">
    <!-- 커스텀 CSS -->
    <link th:href="@{/css/common.css}" rel="stylesheet">
</head>
<body>
<!-- 네비게이션 포함 -->
<div th:replace="~{fragments/navbar :: navbar(${activePage})}"></div>

<!-- 메인 컨텐츠 영역 -->
<main>
    <div class="container">
        <div layout:fragment="content">
            <p>여기에 페이지별 컨텐츠가 들어갑니다.</p>
        </div>
    </div>
</main>

<!-- 푸터 -->
<footer>
    <div class="container text-center text-muted">
        <p class="mb-0">&copy; 2024 도서관리시스템. All rights reserved.</p>
    </div>
</footer>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
