<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">도서관리 시스템</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="bg-gradient-to-r from-blue-600 to-blue-700 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a th:href="@{/}"
                        class="flex items-center space-x-3 text-white hover:text-blue-100 transition-colors">
                        <i class="fas fa-book text-2xl"></i>
                        <span class="text-xl font-bold">도서관리 시스템</span>
                    </a>
                </div>

                <div class="hidden md:flex items-center space-x-8">
                    <a th:href="@{/}"
                        class="flex items-center space-x-2 px-3 py-2 rounded-md text-sm font-medium text-blue-100 hover:bg-blue-700 hover:text-white transition-colors">
                        <i class="fas fa-home"></i>
                        <span>홈</span>
                    </a>
                    <a th:href="@{/books}"
                        class="flex items-center space-x-2 px-3 py-2 rounded-md text-sm font-medium text-blue-100 hover:bg-blue-700 hover:text-white transition-colors">
                        <i class="fas fa-book"></i>
                        <span>도서관리</span>
                    </a>
                    <a th:href="@{/members}"
                        class="flex items-center space-x-2 px-3 py-2 rounded-md text-sm font-medium text-blue-100 hover:bg-blue-700 hover:text-white transition-colors">
                        <i class="fas fa-users"></i>
                        <span>회원관리</span>
                    </a>
                    <a th:href="@{/rentals}"
                        class="flex items-center space-x-2 px-3 py-2 rounded-md text-sm font-medium text-blue-100 hover:bg-blue-700 hover:text-white transition-colors">
                        <i class="fas fa-exchange-alt"></i>
                        <span>대여관리</span>
                    </a>

                    <!-- 로그인/회원가입 버튼 -->
                    <div class="flex items-center space-x-3 ml-4 pl-4 border-l border-blue-500">
                        <!-- 로그인하지 않은 경우 -->
                        <div th:if="${loginMember == null}" class="flex items-center space-x-3">
                            <a th:href="@{/register}"
                                class="flex items-center space-x-2 px-4 py-2 bg-green-500 hover:bg-green-400 text-white rounded-md text-sm font-medium transition-colors">
                                <i class="fas fa-user-plus"></i>
                                <span>회원가입</span>
                            </a>
                            <a th:href="@{/login}"
                                class="flex items-center space-x-2 px-4 py-2 bg-blue-500 hover:bg-blue-400 text-white rounded-md text-sm font-medium transition-colors">
                                <i class="fas fa-sign-in-alt"></i>
                                <span>로그인</span>
                            </a>
                        </div>

                        <!-- 로그인한 경우 -->
                        <div th:if="${loginMember != null}" class="flex items-center space-x-3">
                            <span class="text-blue-100 text-sm">
                                <i class="fas fa-user mr-1"></i>
                                <span th:text="${loginMember.name}">사용자</span>님
                            </span>
                            <a th:href="@{/logout}"
                                class="flex items-center space-x-2 px-4 py-2 bg-red-500 hover:bg-red-400 text-white rounded-md text-sm font-medium transition-colors">
                                <i class="fas fa-sign-out-alt"></i>
                                <span>로그아웃</span>
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Mobile menu button -->
        <div class="md:hidden flex items-center">
            <button type="button" class="text-blue-100 hover:text-white focus:outline-none focus:text-white"
                onclick="toggleMobileMenu()">
                <i class="fas fa-bars text-xl"></i>
            </button>
        </div>
        </div>
        </div>

        <!-- Mobile menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-blue-700">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a th:href="@{/}" class="block px-3 py-2 text-blue-100 hover:bg-blue-800 hover:text-white rounded-md">
                    <i class="fas fa-home mr-2"></i>홈
                </a>
                <a th:href="@{/books}"
                    class="block px-3 py-2 text-blue-100 hover:bg-blue-800 hover:text-white rounded-md">
                    <i class="fas fa-book mr-2"></i>도서관리
                </a>
                <a th:href="@{/members}"
                    class="block px-3 py-2 text-blue-100 hover:bg-blue-800 hover:text-white rounded-md">
                    <i class="fas fa-users mr-2"></i>회원관리
                </a>
                <a th:href="@{/rentals}"
                    class="block px-3 py-2 text-blue-100 hover:bg-blue-800 hover:text-white rounded-md">
                    <i class="fas fa-exchange-alt mr-2"></i>대여관리
                </a>
                <div class="border-t border-blue-600 mt-2 pt-2">
                    <!-- 로그인하지 않은 경우 -->
                    <div th:if="${loginMember == null}">
                        <a th:href="@{/register}"
                            class="block px-3 py-2 text-green-200 hover:bg-green-600 hover:text-white rounded-md">
                            <i class="fas fa-user-plus mr-2"></i>회원가입
                        </a>
                        <a th:href="@{/login}"
                            class="block px-3 py-2 text-blue-100 hover:bg-blue-800 hover:text-white rounded-md">
                            <i class="fas fa-sign-in-alt mr-2"></i>로그인
                        </a>
                    </div>

                    <!-- 로그인한 경우 -->
                    <div th:if="${loginMember != null}">
                        <div class="px-3 py-2 text-blue-100">
                            <i class="fas fa-user mr-2"></i>
                            <span th:text="${loginMember.name}">사용자</span>님
                        </div>
                        <a th:href="@{/logout}"
                            class="block px-3 py-2 text-red-200 hover:bg-red-600 hover:text-white rounded-md">
                            <i class="fas fa-sign-out-alt mr-2"></i>로그아웃
                        </a>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <div layout:fragment="content">
                <!-- Page content will be inserted here -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white mt-auto">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
            <div class="text-center">
                <p class="text-sm text-gray-300">&copy; 2024 도서관리 시스템. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Global Scripts -->
    <script>
        // 공통 알럿 함수
        window.showAlert = function ( message, type = 'info' ) {
            // 기존 알럿이 있으면 제거
            const existingAlert = document.querySelector( '.custom-alert' );
            if ( existingAlert ) {
                existingAlert.remove();
            }

            // 알럿 타입별 스타일 설정
            let bgColor, textColor, icon;
            switch ( type ) {
                case 'success':
                    bgColor = 'bg-green-100 border-green-400';
                    textColor = 'text-green-700';
                    icon = 'fas fa-check-circle';
                    break;
                case 'error':
                    bgColor = 'bg-red-100 border-red-400';
                    textColor = 'text-red-700';
                    icon = 'fas fa-exclamation-triangle';
                    break;
                case 'warning':
                    bgColor = 'bg-yellow-100 border-yellow-400';
                    textColor = 'text-yellow-700';
                    icon = 'fas fa-exclamation-triangle';
                    break;
                default:
                    bgColor = 'bg-blue-100 border-blue-400';
                    textColor = 'text-blue-700';
                    icon = 'fas fa-info-circle';
            }

            // 알럿 엘리먼트 생성
            const alertDiv = document.createElement( 'div' );
            alertDiv.className = `custom-alert fixed top-4 right-4 z-50 ${ bgColor } border ${ textColor } px-4 py-3 rounded-lg shadow-lg max-w-md`;
            alertDiv.innerHTML = `
                <div class="flex items-center">
                    <i class="${ icon } mr-2"></i>
                    <span class="flex-1">${ message }</span>
                    <button onclick="this.parentElement.parentElement.remove()" class="ml-2 ${ textColor } hover:opacity-70">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;

            // 페이지에 추가
            document.body.appendChild( alertDiv );

            // 5초 후 자동 제거
            setTimeout( () => {
                if ( alertDiv.parentElement ) {
                    alertDiv.remove();
                }
            }, 5000 );
        };

        // DOM이 완전히 로드된 후 실행
        document.addEventListener( 'DOMContentLoaded', function () {
            // Mobile menu toggle function
            window.toggleMobileMenu = function () {
                const menu = document.getElementById( 'mobile-menu' );
                if ( menu ) {
                    menu.classList.toggle( 'hidden' );
                }
            };
        } );
    </script>

    <!-- Page-specific scripts will be inserted here -->
    <div layout:fragment="scripts"></div>
</body>

</html>
