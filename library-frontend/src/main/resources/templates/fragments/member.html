<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- 회원가입 폼 -->
<div th:fragment="registerForm" class="p-6">
    <h3 class="text-lg font-semibold mb-4">회원가입</h3>
    <form th:action="@{/members/register}" method="post" class="space-y-4">
        <input name="name" placeholder="이름" class="w-full px-3 py-2 border border-gray-300 rounded-md">
        <input name="phone" placeholder="연락처" class="w-full px-3 py-2 border border-gray-300 rounded-md">
        <input name="password" type="password" placeholder="비밀번호"
            class="w-full px-3 py-2 border border-gray-300 rounded-md">
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">가입</button>
    </form>
</div>

<!-- 로그인 폼 -->
<div th:fragment="loginForm" class="p-6">
    <h3 class="text-lg font-semibold mb-4">로그인</h3>
    <form th:action="@{/login}" method="post" class="space-y-4">
        <input name="username" placeholder="아이디" class="w-full px-3 py-2 border border-gray-300 rounded-md">
        <input name="password" type="password" placeholder="비밀번호"
            class="w-full px-3 py-2 border border-gray-300 rounded-md">
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">로그인</button>
    </form>
</div>

<!-- 상세조회 -->
<div th:fragment="detailView(member)" class="p-6">
    <h3 class="text-lg font-semibold mb-4" th:text="${member.name} + '님 상세정보'">상세정보</h3>
    <div class="space-y-2">
        <p>연락처: <span th:text="${member.phone}">010-1234-5678</span></p>
        <p>가입일: <span>2024-01-01</span></p>
    </div>
</div>

<!-- 수정 폼 -->
<div th:fragment="editForm(member)" class="p-6">
    <h3 class="text-lg font-semibold mb-4" th:text="${member.name} + '님 정보 수정'">정보 수정</h3>
    <form th:action="@{/members/{id}/update(id=${member.id})}" method="post" class="space-y-4">
        <input name="name" th:value="${member.name}" class="w-full px-3 py-2 border border-gray-300 rounded-md">
        <input name="phone" th:value="${member.phone}" class="w-full px-3 py-2 border border-gray-300 rounded-md">
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">수정</button>
    </form>
</div>

</html>
