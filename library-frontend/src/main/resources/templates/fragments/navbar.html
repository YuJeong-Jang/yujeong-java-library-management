<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<nav th:fragment="navbar(activePage)" class="bg-blue-600 shadow-lg">
    <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between h-16">
            <div class="flex items-center space-x-8">
                <a th:href="@{/}"
                    class="flex items-center space-x-2 text-white hover:text-blue-200 px-3 py-2 rounded-md text-sm font-medium">
                    <i class="fas fa-home"></i>
                    <span>홈</span>
                </a>

                <!-- 로그인한 사용자만 볼 수 있는 메뉴 -->
                <div th:if="${session.loginMember}" class="flex items-center space-x-8">
                    <a th:href="@{/books}"
                        class="flex items-center space-x-2 text-white hover:text-blue-200 px-3 py-2 rounded-md text-sm font-medium">
                        <i class="fas fa-book"></i>
                        <span>도서관리</span>
                    </a>
                    <a th:href="@{/members}"
                        class="flex items-center space-x-2 text-white hover:text-blue-200 px-3 py-2 rounded-md text-sm font-medium">
                        <i class="fas fa-users"></i>
                        <span>회원관리</span>
                    </a>
                    <a th:href="@{/rentals}"
                        class="flex items-center space-x-2 text-white hover:text-blue-200 px-3 py-2 rounded-md text-sm font-medium">
                        <i class="fas fa-exchange-alt"></i>
                        <span>대여관리</span>
                    </a>
                </div>
            </div>

            <!-- 우측 메뉴 -->
            <div class="flex items-center space-x-4">
                <!-- 디버깅용 세션 정보 출력 (임시) -->
                <div style="display: none;" th:text="'Session loginMember: ' + ${session.loginMember}"></div>

                <!-- 로그인한 사용자 정보 및 로그아웃 버튼 -->
                <div th:if="${session.loginMember}" class="flex items-center space-x-4">
                    <span class="text-white text-sm">
                        <i class="fas fa-user mr-1"></i>
                        <span th:text="${session.loginMember.name}">사용자명</span>님
                        <span
                            th:if="${session.loginMember.role != null and (session.loginMember.role.name() == 'ADMIN' or session.loginMember.role == 'ADMIN' or session.loginMember.role == 1)}"
                            class="ml-2 px-2 py-1 bg-yellow-500 text-xs rounded">관리자</span>
                    </span>
                    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm">
                        <i class="fas fa-sign-out-alt mr-1"></i>로그아웃
                    </button>
                </div>

                <!-- 로그인하지 않은 사용자 -->
                <div th:unless="${session.loginMember}" class="flex items-center space-x-2">
                    <a th:href="@{/login}" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-sm">
                        <i class="fas fa-sign-in-alt mr-1"></i>로그인
                    </a>
                    <a th:href="@{/register}"
                        class="bg-blue-500 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm">
                        <i class="fas fa-user-plus mr-1"></i>회원가입
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function logout() {
            if ( confirm( '로그아웃 하시겠습니까?' ) ) {
                fetch( '/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                } )
                    .then( response => response.json() )
                    .then( result => {
                        if ( result.success ) {
                            window.location.href = '/';
                        } else {
                            alert( '로그아웃 중 오류가 발생했습니다.' );
                        }
                    } )
                    .catch( error => {
                        console.error( 'Error:', error );
                        alert( '로그아웃 중 오류가 발생했습니다.' );
                    } );
            }
        }
    </script>
</nav>

</html>
