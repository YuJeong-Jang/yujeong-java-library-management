<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<nav th:fragment="navbar(activePage)" class="navbar-baby">
    <div class="navbar-inner">
        <!-- 로고 -->
        <a class="navbar-baby-brand" th:href="@{/}">
            <i class="bi bi-book-heart-fill"></i>
            <span>도서관리시스템</span>
        </a>

        <!-- 모든 메뉴 -->
        <div class="navbar-menu-grid">
            <a th:href="@{/}" th:classappend="${activePage == 'home' ? 'active' : ''}" class="nav-item-baby">
                <small>🏠 홈</small>
                <i class="bi bi-house-door-fill"></i>
            </a>
            <a th:href="@{/books/books}" th:classappend="${activePage == 'books' ? 'active' : ''}" class="nav-item-baby">
                <small>📚 도서</small>
                <i class="bi bi-book-fill"></i>
            </a>
            <a th:href="@{/members/members}" th:classappend="${activePage == 'members' ? 'active' : ''}" class="nav-item-baby">
                <small>👥 회원</small>
                <i class="bi bi-people-fill"></i>
            </a>
            <a th:href="@{/rentals/rentals}" th:classappend="${activePage == 'rentals' ? 'active' : ''}" class="nav-item-baby">
                <small>🔄 대여</small>
                <i class="bi bi-arrow-left-right"></i>
            </a>
        </div>
    </div>
</nav>
</html>
