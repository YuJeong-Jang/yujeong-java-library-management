# Server Configuration
server.port=8080

# Application Configuration
spring.application.name=library-frontend

# Service URLs
library.book.url=http://tomcat-book-svc.tomcat-book.svc.cluster.local:8080
library.member.url=http://tomcat-member-svc.tomcat-member.svc.cluster.local:7070
library.rental.url=http://tomcat-rental-svc.tomcat-rental.svc.cluster.local:9090

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600

# Logging Configuration
logging.level.com.book.library=WARN
logging.level.root=ERROR