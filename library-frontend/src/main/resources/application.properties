# Server Configuration
server.port=8080

# Application Configuration
spring.application.name=library-frontend

# Service URLs
library.book.url=http://tomcat-book-svc:8080
library.member.url=http://tomcat-member-svc:7070
library.rental.url=http://tomcat-rental-avc:9090

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600

# Bean Definition Override
spring.main.allow-bean-definition-overriding=true

# Logging Configuration (최소화)
logging.level.com.book.library=WARN
logging.level.root=ERROR

# 불필요한 기능 비활성화 (경량화)
spring.jmx.enabled=false
management.endpoints.enabled-by-default=false
spring.main.lazy-initialization=true

# 추가 경량화 설정
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.admin.SpringApplicationAdminJmxAutoConfiguration,\
  org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration

# 성능 최적화
spring.main.register-shutdown-hook=false
spring.output.ansi.enabled=never
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024