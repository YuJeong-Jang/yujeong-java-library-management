# Server Configuration
server.port=3000

# Application Configuration
spring.application.name=library-frontend

# Service URLs
library.book.url=http://localhost:8080
library.member.url=http://localhost:7070
library.rental.url=http://localhost:9090

# Thymeleaf Configuration (IntelliJ 개발용)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Static Resources Configuration (IntelliJ 개발용)
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# DevTools Configuration (IntelliJ 최적화)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/resources/templates,src/main/resources/static

# Bean Definition Override
spring.main.allow-bean-definition-overriding=true

# Logging Configuration
logging.level.com.book.library=DEBUG

spring.devtools.livereload.enabled=false